<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DATAVISTA{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <link rel="icon" href="{{ request.url_for('static', path='favicon.ico') }}">
    <link rel="stylesheet" href="{{ request.url_for('static', path='style.css') }}">

</head>
<body>
    {% set current_path = request.url.path %}
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark app-navbar fixed-top">
        <div class="container">
            <a class="navbar-brand brand-mark" href="/"><i class="fas fa-chart-line"></i><span>DATAVISTA</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#datavistaNavbar" aria-controls="datavistaNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="datavistaNavbar">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link {% if current_path == '/laptop' %}active{% endif %}" href="/laptop">Laptop Price Predictor</a>
                    <a class="nav-link {% if current_path == '/diabetes' %}active{% endif %}" href="/diabetes">Diabetes Prediction</a>
                    <a class="nav-link {% if current_path == '/gdp' %}active{% endif %}" href="/gdp">GDP Dashboard</a>
                    <a class="nav-link {% if current_path == '/ipl' %}active{% endif %}" href="/ipl">IPL App</a>
                    <a class="nav-link {% if current_path == '/skill' %}active{% endif %}" href="/skill">Skill Advisory</a>
                    <a class="nav-link {% if current_path == '/census' %}active{% endif %}" href="/census">India Census</a>
                    <a class="nav-link {% if current_path == '/weather' %}active{% endif %}" href="/weather">Weather App</a>
                    <a class="nav-link {% if current_path == '/attendance' %}active{% endif %}" href="/attendance">Attendance System</a>
                    <a class="nav-link {% if current_path == '/students' %}active{% endif %}" href="/students">Student Management</a>
                    <a class="nav-link {% if current_path == '/house' %}active{% endif %}" href="/house">House Prediction</a>
                    <a class="nav-link {% if current_path == '/sql' %}active{% endif %}" href="/sql">SQL Comparison</a>
                    <a class="nav-link {% if current_path == '/faq' %}active{% endif %}" href="/faq">FAQ Extractor</a>
                    <button id="theme-toggle" class="theme-toggle" title="Toggle Theme" aria-label="Toggle theme">🌙</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', path='script.js') }}"></script>

</body>
</html>
